<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resumo de Atendimento</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header>
        <div class="brand-mark" aria-hidden="true"><span></span></div>
        <div class="brand-copy"><p class="eyebrow">Assistente de registro</p><h1>Resumo de atendimento</h1></div>
        <div class="header-actions">
          <button id="theme" class="icon-button theme-button" aria-label="Alternar tema" title="Alternar tema"><span class="theme-icon" aria-hidden="true"></span></button>
          <button id="settings" class="icon-button" aria-label="Abrir configurações" title="Configurações">Ajustes</button>
        </div>
      </header>

      <section>
        <div class="label-row"><label for="transcript">Conversa</label><span id="counter">0 caracteres</span></div>
        <textarea id="transcript" placeholder="Cole aqui a conversa completa do atendimento..." autofocus spellcheck="false"></textarea>
        <div class="field-group">
          <label for="department">Departamento inicial <span>Opcional</span></label>
          <input id="department" list="departments" placeholder="Ex.: Suporte técnico" autocomplete="off">
          <datalist id="departments">
            <option value="Suporte técnico"></option>
            <option value="Comercial"></option>
            <option value="Financeiro"></option>
            <option value="NOC"></option>
            <option value="Retenção"></option>
          </datalist>
        </div>
        <button id="capture" class="secondary">Usar texto selecionado na página</button>
      </section>

      <button id="summarize" class="primary">Gerar resumo</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="resultArea" class="result hidden">
        <div class="label-row"><label for="result">Resumo</label><button id="copy" class="text-button">Copiar</button></div>
        <textarea id="result" readonly spellcheck="false"></textarea>
      </section>
    </main>
    <script src="lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
